[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wos-cli"
version = "0.1.0"
description = "Agent-friendly CLI for the Clarivate Web of Science Starter API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wos = "wos_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wos_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
